name: Manual image publish

# Builds and pushes either or both images on demand, e.g. after a base-image security update.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which image(s) to build and publish"
        required: true
        type: choice
        options:
          - backend
          - frontend
          - both
        default: both

jobs:
  backend:
    if: inputs.target == 'backend' || inputs.target == 'both'
    permissions:
      contents: read
    uses: ./.github/workflows/build-image.yml
    with:
      project_dir: backend
      image_name: registry.caaat.pro/thingport/backend
      context: ./backend
      dockerfile: backend/Dockerfile
      cache_scope: backend
      push: true
    secrets: inherit

  frontend:
    if: inputs.target == 'frontend' || inputs.target == 'both'
    permissions:
      contents: read
    uses: ./.github/workflows/build-image.yml
    with:
      project_dir: frontend
      image_name: registry.caaat.pro/thingport/frontend
      context: ./frontend
      dockerfile: frontend/Dockerfile
      cache_scope: frontend
      push: true
    secrets: inherit
