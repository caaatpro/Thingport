name: Backend image

# Runs when backend/ or the build workflow changes. Use "Manual image publish" to force a build.
on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*.*.*"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-image.yml"
      - ".github/workflows/build-image.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-image.yml"
      - ".github/workflows/build-image.yml"

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full backend suite against real Postgres, including end-to-end provider imports. The image
  # is only built and published if this passes.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine # same as docker-compose.yml
        env:
          POSTGRES_USER: thingport
          POSTGRES_PASSWORD: thingport
          POSTGRES_DB: thingport_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thingport -d thingport_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://thingport:thingport@localhost:5432/thingport_test?schema=public
      FILE_STORAGE: /tmp/thingport-storage
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test

  build:
    needs: test
    permissions:
      contents: read
    uses: ./.github/workflows/build-image.yml
    with:
      project_dir: backend
      image_name: registry.caaat.pro/thingport/backend
      context: ./backend
      dockerfile: backend/Dockerfile
      cache_scope: backend
      push: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
