name: Frontend image

# Runs when frontend/ or the build workflow changes. Use "Manual image publish" to force a build.
on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*.*.*"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-image.yml"
      - ".github/workflows/build-image.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-image.yml"
      - ".github/workflows/build-image.yml"

concurrency:
  group: frontend-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build-image.yml
    with:
      project_dir: frontend
      image_name: registry.caaat.pro/thingport/frontend
      context: ./frontend
      dockerfile: frontend/Dockerfile
      cache_scope: frontend
      push: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
