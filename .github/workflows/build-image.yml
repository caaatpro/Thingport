name: Build image (reusable)

# Shared build+push logic used by backend-image.yml, frontend-image.yml, and
# manual-image.yml — not triggered on its own (workflow_call only).
on:
  workflow_call:
    inputs:
      project_dir:
        description: "The npm project directory to lint, e.g. backend or frontend"
        required: true
        type: string
      image_name:
        description: "Fully-qualified image name, e.g. registry.caaat.pro/thingport/backend"
        required: true
        type: string
      registry:
        description: "Container registry host to log in to and push to"
        required: false
        type: string
        default: registry.caaat.pro
      context:
        description: "Docker build context"
        required: true
        type: string
      dockerfile:
        description: "Path to the Dockerfile"
        required: true
        type: string
      bundle_extension:
        description: "Build the Thingport Grab zip into <project_dir>/public/downloads so the image serves it"
        required: false
        type: boolean
        default: false
      cache_scope:
        description: "GHA cache scope, so backend/frontend caches don't collide"
        required: true
        type: string
      platforms:
        description: "Target platforms for the image build"
        required: false
        type: string
        default: linux/amd64
      push:
        description: "Whether to log in and push (false for PR validation builds)"
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ inputs.project_dir }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ inputs.project_dir }}
        run: npm ci --no-audit --no-fund

      - name: Lint (quality gate — blocks the image build on failure)
        working-directory: ${{ inputs.project_dir }}
        run: npm run lint

      # `vite build` strips types without checking them. The backend has no typecheck script (its build
      # runs tsc), so --if-present makes this a no-op there.
      - name: Typecheck (quality gate — frontend only, see comment)
        working-directory: ${{ inputs.project_dir }}
        run: npm run --if-present typecheck

      - name: Build the browser extension zip served from the image
        if: inputs.bundle_extension
        run: |
          npm --prefix extension ci --no-audit --no-fund
          npm --prefix extension run zip:chrome
          mkdir -p "${{ inputs.project_dir }}/public/downloads"
          cp extension/dist/zips/thingport-grab-chrome.zip "${{ inputs.project_dir }}/public/downloads/"

      - name: Set up QEMU (for the arm64 leg of the multi-arch build below)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the container registry
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image_name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope }}
